<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #ffffff; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Animación de carga rápida mientras se procesa la redirección -->
    <div class="loader"></div>

<script>
    // 1. OBTENER EL NÚMERO DIRECTAMENTE DE LA URL (ej: ?id=14)
    const urlParams = new URLSearchParams(window.location.search);
    const idCliente = urlParams.get('id');

    // 2. BASE DE DATOS DE TUS CLIENTES
    const db = {
        "1": "https://instagram.com",
        "14": "https://menu-digital-cliente14.com",
        "15": "https://facebook.com"
    };

    // 3. REDIRECCIÓN AUTOMÁTICA
    if (idCliente && db[idCliente]) {
        window.location.href = db[idCliente];
    } else {
        // Si escanean el QR sin número o el ID no existe, muestra un mensaje amigable
        document.body.innerHTML = "<div style='text-align:center;'><h2>Tarjeta no configurada o inválida.</h2><p>Por favor, contacta al administrador.</p></div>";
    }
</script>
</body>
</html>
